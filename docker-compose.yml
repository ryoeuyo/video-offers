services:
  db:
    image: postgres:16-alpine
    container_name: video-offers-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_offers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_offers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
